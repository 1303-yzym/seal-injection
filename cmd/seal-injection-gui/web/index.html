<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印章注入器</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --line: #e3e6ea;
    --text: #1f2328;
    --muted: #6b7280;
    --brand: #c0392b;
    --brand-dark: #a3301f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 28px 24px 40px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  header { max-width: 1020px; margin: 0 auto 20px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  h1::before { content: "◎"; color: var(--brand); margin-right: 8px; font-size: 20px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 1020px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px;
    align-items: start;
  }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .drop {
    position: relative; min-height: 420px; border-radius: 10px;
    display: grid; place-items: center; cursor: pointer; overflow: hidden;
    background-image:
      linear-gradient(45deg, #eaedf1 25%, transparent 25%),
      linear-gradient(-45deg, #eaedf1 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eaedf1 75%),
      linear-gradient(-45deg, transparent 75%, #eaedf1 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #fbfcfd;
    outline: 1px dashed #cfd4da; outline-offset: -1px;
  }
  .drop.over { outline: 2px dashed var(--brand); outline-offset: -2px; }
  .drop.empty .hint { display: block; }
  .hint {
    display: none; text-align: center; padding: 24px; pointer-events: none;
    background: rgba(255,255,255,.86); border-radius: 10px;
  }
  .hint strong { display: block; font-size: 15px; margin-bottom: 6px; }
  .hint span { color: var(--muted); font-size: 12.5px; }
  #sealImg { max-width: 100%; max-height: 520px; display: block; }
  .toolbar {
    display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segmented button {
    border: 0; background: #fff; padding: 5px 14px; font-size: 13px;
    cursor: pointer; color: var(--muted); font-family: inherit;
  }
  .segmented button.active { background: #fdecea; color: var(--brand-dark); font-weight: 600; }
  .badge {
    font-size: 12.5px; color: var(--muted);
    background: #f3f4f6; border-radius: 6px; padding: 3px 9px;
  }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .controls { display: flex; flex-direction: column; gap: 12px; }
  .controls label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .controls input[type=number] {
    width: 92px; padding: 6px 8px; font: inherit; text-align: right;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .controls input[type=number]:focus { outline: 2px solid #f5c6c0; border-color: var(--brand); }
  .check { justify-content: flex-start !important; gap: 8px !important; cursor: pointer; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  button.big {
    width: 100%; padding: 9px 12px; font: inherit; font-size: 14px; cursor: pointer;
    border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--text);
  }
  button.big.primary {
    background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600;
  }
  button.big.primary:hover:not(:disabled) { background: var(--brand-dark); }
  button.big:disabled { opacity: .45; cursor: not-allowed; }
  .status { margin: 0; font-size: 12.5px; color: var(--muted); min-height: 34px; }
  .status.err { color: #b42318; }
  .link {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
    cursor: pointer; text-decoration: underline; padding: 0; align-self: flex-start;
  }
  .tip { margin: 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; }
    .drop { min-height: 300px; }
  }
</style>
</head>
<body>
<header>
  <h1>印章注入器</h1>
  <p class="sub">把白底（或浅色纸）上的红色印章分离成透明背景，再盖到 Word 文档的指定位置</p>
</header>

<main>
  <section class="panel">
    <div id="drop" class="drop empty">
      <div class="hint">
        <strong>把印章图片拖到这里</strong>
        <span>或者点击选择文件 · 支持 png / jpg</span>
      </div>
      <img id="sealImg" alt="印章预览" hidden>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="segmented">
        <button type="button" data-view="seal" class="active">提取结果</button>
        <button type="button" data-view="source">原图</button>
      </div>
      <span class="badge" id="inkBadge">印泥 —</span>
      <span class="badge" id="covBadge">覆盖 —</span>
      <span class="badge" id="sizeBadge">源图 —</span>
    </div>
  </section>

  <aside class="panel controls">
    <label>印章宽度 <span><input id="size" type="number" value="4" min="0.5" max="20" step="0.1"> 厘米</span></label>
    <label>左边距 X <span><input id="x" type="number" value="15" min="0" max="30" step="0.1"> 厘米</span></label>
    <label>上边距 Y <span><input id="y" type="number" value="23" min="0" max="40" step="0.1"> 厘米</span></label>
    <label class="check"><input id="behind" type="checkbox"> 盖在文字下方</label>
    <div class="actions">
      <button type="button" class="big primary" id="btnDocx" disabled>下载 .docx</button>
      <button type="button" class="big" id="btnPng" disabled>下载透明 PNG</button>
    </div>
    <p class="status" id="status">还没有选择图片</p>
    <p class="tip">位置以 A4 页面左上角为原点；宽度改变时高度按原图比例缩放。</p>
    <button type="button" class="link" id="btnQuit">退出服务</button>
  </aside>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const drop = $('drop'), img = $('sealImg'), toolbar = $('toolbar');
  const status = $('status');
  const btnDocx = $('btnDocx'), btnPng = $('btnPng');
  const state = { id: null, view: 'seal', name: '' };

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle('err', !!isError);
  }

  function show(info) {
    drop.classList.remove('empty');
    img.hidden = false;
    toolbar.hidden = false;
    $('inkBadge').innerHTML = '<span class="swatch" style="background:' + info.ink + '"></span>印泥 ' + info.ink;
    $('covBadge').textContent = '覆盖 ' + (info.coverage * 100).toFixed(1) + '%';
    $('sizeBadge').textContent = '源图 ' + info.width + '×' + info.height;
    state.view = 'seal';
    img.src = '/api/seal?id=' + info.id + '&t=' + Date.now();
    document.querySelectorAll('.segmented button').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === 'seal');
    });
    btnDocx.disabled = false;
    btnPng.disabled = false;
  }

  async function upload(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) {
      setStatus('请选择图片文件（png / jpg）', true);
      return;
    }
    state.name = file.name;
    setStatus('正在提取红色印章…');
    const body = new FormData();
    body.append('seal', file, file.name);
    try {
      const resp = await fetch('/api/extract', { method: 'POST', body });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '提取失败');
      state.id = data.id;
      show(data);
      setStatus('提取完成：印泥 ' + data.ink + '，覆盖 ' + (data.coverage * 100).toFixed(1) + '%。纸面和文字都已被去掉。');
    } catch (err) {
      setStatus(String(err.message || err), true);
    }
  }

  drop.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => upload(input.files[0]);
    input.click();
  });
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.remove('over');
  }));
  drop.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    upload(file);
  });

  document.querySelectorAll('.segmented button').forEach((b) => {
    b.addEventListener('click', () => {
      if (!state.id) return;
      state.view = b.dataset.view;
      document.querySelectorAll('.segmented button').forEach((x) => x.classList.toggle('active', x === b));
      img.src = '/' + (state.view === 'seal' ? 'api/seal' : 'api/source') + '?id=' + state.id + '&t=' + Date.now();
    });
  });

  function num(id) {
    const v = parseFloat($(id).value);
    return Number.isFinite(v) ? v : 0;
  }

  function filenameFrom(header, fallback) {
    if (!header) return fallback;
    let m = /filename\*=UTF-8''([^;]+)/i.exec(header);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) { /* ignore */ } }
    m = /filename="?([^";]+)"?/i.exec(header);
    return m ? m[1] : fallback;
  }

  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  async function downloadDocx() {
    if (!state.id) return;
    setStatus('正在生成文档…');
    const q = new URLSearchParams({
      id: state.id,
      size: String(num('size')),
      x: String(num('x')),
      y: String(num('y')),
      behind: $('behind').checked ? '1' : '0',
    });
    try {
      const resp = await fetch('/api/docx?' + q.toString(), { method: 'POST' });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || '生成失败');
      }
      const blob = await resp.blob();
      const name = filenameFrom(resp.headers.get('Content-Disposition'), 'seal.docx');
      saveBlob(blob, name);
      setStatus('已生成：' + name);
    } catch (err) {
      setStatus(String(err.message || err), true);
    }
  }

  async function downloadPng() {
    if (!state.id) return;
    setStatus('正在导出 PNG…');
    try {
      const resp = await fetch('/api/png?id=' + state.id);
      if (!resp.ok) throw new Error('导出失败');
      const blob = await resp.blob();
      const name = filenameFrom(resp.headers.get('Content-Disposition'), 'seal.png');
      saveBlob(blob, name);
      setStatus('已导出：' + name);
    } catch (err) {
      setStatus(String(err.message || err), true);
    }
  }

  btnDocx.addEventListener('click', downloadDocx);
  btnPng.addEventListener('click', downloadPng);
  $('btnQuit').addEventListener('click', async () => {
    setStatus('服务已退出，可以关掉这个页面了。');
    try { await fetch('/api/quit', { method: 'POST' }); } catch (e) { /* 服务已退出 */ }
  });
})();
</script>
</body>
</html>
